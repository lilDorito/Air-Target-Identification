data_path: data/targets.csv

seeds:
  train: 101
  val: 202
  test: 303
  shifted_test: 404
  model: 42
  family_split: 7

samples_per_aircraft:
  train: 200
  val: 50
  test: 50
  shifted_test: 50

sampling:
  speed: triangular # min .. max, mode at cruise
  altitude: uniform
  climb_turn_skew: 3.0 # higher = more mass near zero
  rcs: log_uniform
noise:
  speed_rel: 0.05
  altitude_rel: 0.10
  rcs_db: 3.0
shifted_test:
  speed: uniform
  noise_multiplier: 2.0

unseen_experiment:
  group_column: family
  n_splits: 5

lightgbm:
  n_estimators: 2000 # upper bound
  early_stopping_rounds: 50
  num_threads: 0 # 0 = all cores
  class_weight_for: [role, type]
  params: # defaults, tuned vals (results/tuning/best_params.yaml) override these
    learning_rate: 0.1
    num_leaves: 31
    min_data_in_leaf: 20
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 10.0
    max_delta_step: 1.0
    max_bin: 255

tuning:
  n_trials: 30
  timeout_s: 3600
  samples_per_aircraft_train: 50
  seed: 42
  report_every: 10
  pruning_warmup: 20
  best_params_path: results/tuning/best_params.yaml

calibration: temperature # fitted on val set
ablation_drop_estimated: true

evaluation:
  track_lengths: [1, 3, 5, 10] # observations combined per radar track (aircraft model)

# operator filter: the notebook checks it on these countries (any state in the operators column works)
filter_examples: [Russia, Ukraine]
