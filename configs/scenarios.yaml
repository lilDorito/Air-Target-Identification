# input columns per sensor scenario

never_inputs: [name, manufacturer, callsign, family, country, operators, type, role, ua_war, status,
               flight_profile, sources, estimated_fields, notes]

scenarios:
  A_radar:
    numeric: [speed, altitude, climb_rate, turn_rate, rcs]
    categorical: []

  B_radar_sensors:
    extends: A_radar
    numeric: [engine_count]
    categorical: [engine_type, afterburner, ir_category]

  C_all:
    extends: B_radar_sensors
    numeric: [length_m, wingspan_m, mtow_kg, first_flight]
    categorical: []

targets: [name, role, type]
